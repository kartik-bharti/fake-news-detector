<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; text-align: center; padding: 50px; }
       .box { background: white; padding: 30px; border-radius: 10px; width: 60%; margin: auto; box-shadow: 0px 0px 10px gray; }
        textarea { width: 90%; height: 100px; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
       .result { font-size: 24px; font-weight: bold; margin-top: 20px; }
       .REAL { color: green; }
       .FAKE { color: red; }
    </style>
</head>
<body>
    <div class="box">
        <h1>📰 Fake News Detector</h1>
        <p>Tuzhi news ithe paste kar ani check kar</p>
        <form method="POST">
            <textarea name="news" placeholder="News ithe lih...">{{ news_text }}</textarea><br><br>
            <button type="submit">Check Kara</button>
        </form>
        
        {% if prediction %}
        <div class="result {{ prediction }}">
            Result: {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
